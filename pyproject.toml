[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentshelf"
version = "0.1.0"
description = "本地个人 AI 产物仓库"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "python-multipart>=0.0.12",
  "typer>=0.12",
  "platformdirs>=4.3",
  "pypdf>=5.1",
  "httpx>=0.27",
]

[project.optional-dependencies]
semantic = ["sentence-transformers>=3.0"]
dev = ["pytest>=8.3", "httpx>=0.27"]

[project.scripts]
agentshelf = "agentshelf.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
