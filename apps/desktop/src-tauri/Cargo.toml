[package]
name = "agentshelf-desktop"
version = "0.2.2"
description = "AgentShelf desktop shell"
authors = ["AgentShelf"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "agentshelf_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
